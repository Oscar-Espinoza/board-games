<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172c13"/>
      <stop offset=".6" stop-color="#25461d"/>
      <stop offset="1" stop-color="#2f5625"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#244a1d"/>
      <stop offset=".55" stop-color="#3d7230"/>
      <stop offset="1" stop-color="#5b9243"/>
    </linearGradient>
    <linearGradient id="darkB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f1f0c"/>
      <stop offset="1" stop-color="#20401a"/>
    </linearGradient>
    <linearGradient id="litB" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#1b3816"/>
      <stop offset="1" stop-color="#3a6a2c"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".55" cy=".35" r=".5">
      <stop offset="0" stop-color="#e9ffd0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e9ffd0" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="5" dy="9" stdDeviation="6" flood-color="#0a0502" flood-opacity=".6"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#050b03" flood-opacity=".6"/>
    </filter>
    <path id="shape" d="M0 0 C-8 -24 26 -44 56 -34 C78 -26 94 -12 108 0 C94 12 78 26 56 34 C26 44 -8 24 0 0 Z"/>
    <g id="veins" fill="none">
      <path d="M2 0 Q54 -3 106 0" stroke="#a9cf86" stroke-width="1.8" stroke-opacity=".45"/>
      <g stroke="#0c1a09" stroke-width="1.2" stroke-opacity=".4">
        <path d="M22 -1 Q30 -16 26 -30"/><path d="M42 -2 Q54 -16 54 -31"/><path d="M64 -2 Q76 -12 80 -22"/>
        <path d="M22 1 Q30 16 26 30"/><path d="M42 2 Q54 16 54 31"/><path d="M64 2 Q76 12 80 22"/>
      </g>
    </g>
    <g id="leaf">
      <use xlink:href="#shape" fill="url(#dark)"/>
      <path d="M0 0 C-8 -24 26 -44 56 -34 C78 -26 94 -12 108 0 Q54 -3 0 0 Z" fill="url(#lit)"/>
      <ellipse cx="54" cy="-15" rx="34" ry="13" fill="url(#sheen)"/>
      <use xlink:href="#veins"/>
    </g>
    <g id="leafB">
      <use xlink:href="#shape" fill="url(#darkB)"/>
      <path d="M0 0 C-8 -24 26 -44 56 -34 C78 -26 94 -12 108 0 Q54 -3 0 0 Z" fill="url(#litB)"/>
      <use xlink:href="#veins" opacity=".6"/>
    </g>
  </defs>
  <g filter="url(#drop)">
    <g fill="none" stroke="#33401c" stroke-width="2.4" stroke-linecap="round">
      <path d="M-20 -20 Q10 40 10 90"/><path d="M-20 -20 Q30 50 40 96"/><path d="M-20 -20 Q50 60 78 104"/><path d="M-20 -20 Q70 70 100 130"/><path d="M-20 -20 Q40 90 30 140"/><path d="M-20 -20 Q100 60 130 110"/>
    </g>
    <!-- back layer -->
    <use xlink:href="#leafB" filter="url(#soft)" transform="translate(-8 130) rotate(80) scale(.7)"/>
    <use xlink:href="#leafB" filter="url(#soft)" transform="translate(100 130) rotate(45) scale(.62)"/>
    <use xlink:href="#leafB" filter="url(#soft)" transform="translate(130 110) rotate(10) scale(.55)"/>
    <use xlink:href="#leafB" filter="url(#soft)" transform="translate(0 0) rotate(35) scale(.62)"/>
    <!-- front layer -->
    <use xlink:href="#leaf" filter="url(#soft)" transform="translate(10 30) rotate(12) scale(.55)"/>
    <use xlink:href="#leaf" filter="url(#soft)" transform="translate(-5 40) rotate(55) scale(.6)"/>
    <use xlink:href="#leaf" filter="url(#soft)" transform="translate(30 140) rotate(62) scale(.66)"/>
    <use xlink:href="#leaf" filter="url(#soft)" transform="translate(10 90) rotate(60) scale(.72)"/>
    <use xlink:href="#leaf" filter="url(#soft)" transform="translate(78 104) rotate(18) scale(.7)"/>
    <use xlink:href="#leaf" filter="url(#soft)" transform="translate(60 150) rotate(40) scale(.56)"/>
    <use xlink:href="#leaf" filter="url(#soft)" transform="translate(40 96) rotate(32) scale(.78)"/>
  </g>
</svg>
