<svg xmlns="http://www.w3.org/2000/svg" width="240" height="360" viewBox="-60 0 240 360">
  <defs>
    <radialGradient id="corkFill" cx=".45" cy=".4" r=".65">
      <stop offset="0" stop-color="#9c6536"/>
      <stop offset=".75" stop-color="#84522a"/>
      <stop offset="1" stop-color="#63391b"/>
    </radialGradient>
    <filter id="cork" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="4" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 .28  0 0 0 0 .15  0 0 0 0 .06  -3.4 0 0 0 2.05" result="dark"/>
      <feColorMatrix in="n" values="0 0 0 0 .86  0 0 0 0 .62  0 0 0 0 .38  3.2 0 0 0 -2.05" result="light"/>
      <feMerge result="spk"><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
      <feComposite in="spk" in2="SourceGraphic" operator="in" result="clip"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="clip"/></feMerge>
    </filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <linearGradient id="body" x1="-40" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7f776b"/>
      <stop offset=".22" stop-color="#c4bcae"/>
      <stop offset=".45" stop-color="#e6dfd2"/>
      <stop offset=".62" stop-color="#efe9de"/>
      <stop offset=".86" stop-color="#c5bdaf"/>
      <stop offset="1" stop-color="#857c6f"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9a194"/>
      <stop offset="1" stop-color="#e9e4da"/>
    </linearGradient>
    <radialGradient id="coffee" cx=".55" cy=".45" r=".6">
      <stop offset="0" stop-color="#2d170b"/>
      <stop offset=".8" stop-color="#1a0c05"/>
      <stop offset="1" stop-color="#3a2212"/>
    </radialGradient>
  </defs>
  <!-- coaster -->
  <ellipse cx="46" cy="262" rx="126" ry="98" fill="#0b0502" opacity=".6" filter="url(#blur10)" transform="translate(8 12)"/>
  <ellipse cx="46" cy="258" rx="122" ry="94" fill="#5b3418"/>
  <ellipse cx="46" cy="252" rx="122" ry="94" fill="url(#corkFill)" filter="url(#cork)"/>
  <ellipse cx="46" cy="252" rx="121" ry="93" fill="none" stroke="#6a3f1d" stroke-width="3" opacity=".7"/>
  <ellipse cx="46" cy="252" rx="108" ry="82" fill="none" stroke="#5c3518" stroke-width="1.5" opacity=".45"/>
  <ellipse cx="46" cy="252" rx="106" ry="80" fill="none" stroke="#d9a570" stroke-width="1" opacity=".25" transform="translate(0 2)"/>
  <!-- mug cast shadow -->
  <ellipse cx="66" cy="286" rx="78" ry="30" fill="#140902" opacity=".55" filter="url(#blur10)"/>
  <ellipse cx="34" cy="276" rx="64" ry="20" fill="#0f0602" opacity=".7" filter="url(#blur4)"/>
  <!-- mug body -->
  <path d="M-32 92 L-32 270 A66 26 0 0 0 100 270 L100 92 Z" fill="url(#body)"/>
  <path d="M-32 256 L-32 270 A66 26 0 0 0 100 270 L100 256 A66 26 0 0 1 -32 256 Z" fill="#6f675c" opacity=".22"/>
  <rect x="44" y="96" width="14" height="168" fill="#ffffff" opacity=".22" filter="url(#blur4)"/>
  <!-- rim + coffee -->
  <ellipse cx="34" cy="92" rx="66" ry="28" fill="#ebe5da"/>
  <ellipse cx="34" cy="92" rx="66" ry="28" fill="none" stroke="#c9c1b4" stroke-width="1"/>
  <ellipse cx="34" cy="93" rx="58" ry="23" fill="url(#inner)"/>
  <ellipse cx="34" cy="98" rx="55" ry="20" fill="url(#coffee)"/>
  <ellipse cx="34" cy="98" rx="55" ry="20" fill="none" stroke="#6b4428" stroke-width="2" opacity=".55"/>
  <ellipse cx="48" cy="92" rx="20" ry="5" fill="#f3e2cc" opacity=".2" filter="url(#blur2)"/>
  <path d="M-24 88 A58 22 0 0 1 40 71" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7" filter="url(#blur2)"/>
</svg>
