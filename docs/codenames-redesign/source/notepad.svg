<svg xmlns="http://www.w3.org/2000/svg" width="260" height="400" viewBox="0 0 260 400">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#0a0502" flood-opacity=".6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="9" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 -.45 .26" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="c"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="c"/></feMerge>
    </filter>
    <linearGradient id="page" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#f4ecdb"/>
      <stop offset=".6" stop-color="#ede3cd"/>
      <stop offset="1" stop-color="#e0d3b8"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e5a55"/>
      <stop offset=".45" stop-color="#e8e6e2"/>
      <stop offset=".7" stop-color="#9d9892"/>
      <stop offset="1" stop-color="#4a4641"/>
    </linearGradient>
    <g id="coil">
      <ellipse cx="0" cy="22" rx="4.2" ry="3.6" fill="#3b2a1a" opacity=".85"/>
      <path d="M-3 22 C-5 10 -3 -2 2 -4 C6 -5 7 2 6 10" fill="none" stroke="#2a2623" stroke-width="4.6" stroke-linecap="round" opacity=".55" transform="translate(1.5 1.5)"/>
      <path d="M-3 22 C-5 10 -3 -2 2 -4 C6 -5 7 2 6 10" fill="none" stroke="url(#wire)" stroke-width="3.6" stroke-linecap="round"/>
    </g>
  </defs>
  <g transform="rotate(5 130 200)" filter="url(#shadow)">
    <!-- backing board and page stack -->
    <rect x="18" y="34" width="210" height="340" rx="4" fill="#6e5238"/>
    <rect x="16" y="31" width="208" height="338" rx="3" fill="#d3c4a5"/>
    <rect x="14" y="29" width="206" height="336" rx="3" fill="#e3d6bb"/>
    <rect x="12" y="26" width="204" height="334" rx="3" fill="url(#page)" filter="url(#grain)"/>
    <g stroke="#8fa2ad" stroke-width="1" opacity=".28">
      <path d="M28 92 H200"/><path d="M28 120 H200"/><path d="M28 148 H200"/><path d="M28 176 H200"/><path d="M28 204 H200"/><path d="M28 232 H200"/><path d="M28 260 H200"/><path d="M28 288 H200"/><path d="M28 316 H200"/>
    </g>
    <path d="M12 26 H216" stroke="#fffaf0" stroke-width="1.5" opacity=".7"/>
    <!-- spiral binding -->
    <g transform="translate(0 14)">
      <use href="#coil" x="30"/><use href="#coil" x="52"/><use href="#coil" x="74"/><use href="#coil" x="96"/><use href="#coil" x="118"/><use href="#coil" x="140"/><use href="#coil" x="162"/><use href="#coil" x="184"/>
    </g>
  </g>
</svg>
