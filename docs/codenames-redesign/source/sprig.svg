<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="170" height="90" viewBox="0 0 170 90">
  <defs>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a3315"/><stop offset="1" stop-color="#2f5625"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#284f20"/><stop offset="1" stop-color="#5b9243"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-40%" width="170%" height="190%">
