<svg xmlns="http://www.w3.org/2000/svg" width="300" height="240" viewBox="0 0 300 240">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="6" dy="14" stdDeviation="11" flood-color="#0a0502" flood-opacity=".62"/>
    </filter>
    <filter id="linen" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.1 .04" numOctaves="2" seed="2" result="a"/>
      <feTurbulence type="fractalNoise" baseFrequency=".04 1.1" numOctaves="2" seed="8" result="b"/>
      <feComposite in="a" in2="b" operator="arithmetic" k2=".5" k3=".5" result="ab"/>
      <feColorMatrix in="ab" values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .14  -1.1 0 0 0 .66" result="weave"/>
      <feComposite in="weave" in2="SourceGraphic" operator="in" result="c"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="c"/></feMerge>
    </filter>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3b98f"/>
      <stop offset=".55" stop-color="#c1a176"/>
      <stop offset="1" stop-color="#a5845a"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d2"/>
      <stop offset="1" stop-color="#c9b996"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <!-- back board, page block, front board -->
    <rect x="30" y="38" width="238" height="176" rx="4" fill="#5b3b22"/>
    <rect x="30" y="30" width="232" height="178" rx="2" fill="url(#pages)"/>
    <g stroke="#b3a27f" stroke-width=".7" opacity=".7">
      <path d="M32 200 H262"/><path d="M32 203 H262"/><path d="M32 206 H262"/><path d="M258 34 V206"/><path d="M261 34 V206"/>
    </g>
    <rect x="24" y="24" width="236" height="178" rx="4" fill="url(#cover)" filter="url(#linen)"/>
    <rect x="24" y="24" width="236" height="178" rx="4" fill="none" stroke="#8d7049" stroke-width="1.5" opacity=".6"/>
    <path d="M42 24 V202" stroke="#8b6c45" stroke-width="2" opacity=".35"/>
    <path d="M45 24 V202" stroke="#f0dcb6" stroke-width="1" opacity=".35"/>
    <path d="M26 25 H258" stroke="#f3e2c2" stroke-width="1.2" opacity=".6"/>
  </g>
</svg>
