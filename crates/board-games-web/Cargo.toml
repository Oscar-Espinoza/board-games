[package]
name = "board-games-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
color-match.workspace = true
table-protocol.workspace = true
serde_json.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Node", "Event", "EventTarget", "Crypto", "console", "Location", "HtmlSelectElement", "HtmlDialogElement", "NodeList"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
fixtures = []
