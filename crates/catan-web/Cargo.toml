[package]
name = "catan-web"
version.workspace = true
edition.workspace = true
publish.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
table-browser.workspace = true
catan.workspace = true
catan-session.workspace = true
table-protocol.workspace = true
table-session.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "26", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
web-sys = { version = "0.3", features = ["Window","Document","Element","HtmlElement","HtmlInputElement","HtmlSelectElement","HtmlCanvasElement","HtmlDialogElement","Node","NodeList","Event","EventTarget","Location","Crypto","DomTokenList","console"] }
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
fixtures = []
