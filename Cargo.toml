[workspace]
members = [
    "crates/game-catalog",
    "crates/table-browser",
    "crates/catan-replay",
    "crates/catan-web",
    "crates/catan-session",
    "crates/catan",
    "crates/table-types",
    "crates/table-protocol",
    "crates/table-session",
    "crates/table-server",
    "crates/color-match",
    "crates/color-match-session",
    "crates/color-match-web",
    "crates/color-match-replay",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
game-catalog = { path = "crates/game-catalog" }
table-browser = { path = "crates/table-browser" }
catan-session = { path = "crates/catan-session" }
catan = { path = "crates/catan" }
table-types = { path = "crates/table-types" }
table-session = { path = "crates/table-session" }
color-match-session = { path = "crates/color-match-session" }
color-match = { path = "crates/color-match" }
table-protocol = { path = "crates/table-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
opt-level = "s"
